[package]
name = "stellarforge-tx"
description = "Transaction construction primitives for StellarForge: fees, memos, time bounds, and the transaction builder."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
serde = { workspace = true }
serde_json = "1.0.151"
stellarforge-core = { path = "../stellarforge-core" }
tokio = { version = "1.53.1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "macros"] }
wiremock = "0.6.5"
